<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>AI-RAN — هوش مصنوعی در شبکهٔ دسترسی رادیویی | ارائهٔ تعاملی</title>
  <meta name="description" content="ارائهٔ تعاملی Prezi-style دربارهٔ AI-RAN: AI for RAN، AI in RAN و AI on RAN — به زبان فارسی با اصطلاحات فنی انگلیسی.">
  <meta name="author" content="AI-RAN Teaching Project">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23071018'/%3E%3Ccircle cx='32' cy='32' r='17' fill='none' stroke='%234f8cff' stroke-width='4'/%3E%3Ccircle cx='32' cy='32' r='6' fill='%232dd4bf'/%3E%3C/svg%3E">

  <link rel="preload" href="assets/fonts/Vazirmatn-Regular.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/Vazirmatn-Bold.woff2" as="font" type="font/woff2" crossorigin>

  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/presentation.css">
  <link rel="stylesheet" href="css/animations.css">
</head>
<body>

  <!-- boot / loading veil, removed once the presentation is built -->
  <div id="boot" role="status" aria-live="polite">
    <div class="boot-inner">
      <div class="boot-mark" aria-hidden="true"></div>
      <div class="boot-title">AI-RAN</div>
      <div class="boot-sub">در حال آماده‌سازی نقشهٔ دانش…</div>
      <div class="boot-bar"><span></span></div>
    </div>
  </div>

  <noscript>
    <div class="noscript">
      این ارائه برای ناوبری تعاملی به JavaScript نیاز دارد. لطفاً JavaScript را فعال کنید.
    </div>
  </noscript>

  <!-- the presentation canvas -->
  <main id="stage" class="stage" aria-label="بوم ارائهٔ تعاملی AI-RAN">
    <div id="world" class="world accent-intro" data-zoom="far"></div>
  </main>

  <!-- presentation chrome -->
  <header id="hud-top" class="hud hud-top"></header>
  <nav id="hud-nav" class="hud hud-nav" aria-label="ناوبری موضوع‌ها"></nav>
  <div id="hud-zoom" class="hud hud-zoom" aria-label="بزرگ‌نمایی"></div>
  <aside id="hud-map" class="hud hud-map" title="نقشهٔ کلی" aria-label="نقشهٔ کلی"></aside>

  <aside id="toc" class="drawer" aria-label="فهرست موضوع‌ها"></aside>
  <section id="notes" class="notes" aria-label="یادداشت مدرس"></section>
  <div id="help" class="modal" role="dialog" aria-modal="true" aria-label="راهنمای ناوبری"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <div id="boot-error" hidden class="boot-error" role="alert"></div>
  <pre id="selftest-output" class="sr-only" aria-hidden="true"></pre>

  <!-- content model (order matters: core → sections → wrap-up which finalises) -->
  <script src="content/00-core.js"></script>
  <script src="content/10-intro.js"></script>
  <script src="content/20-for.js"></script>
  <script src="content/30-in.js"></script>
  <script src="content/40-on.js"></script>
  <script src="content/50-compare.js"></script>
  <script src="content/60-eco.js"></script>
  <script src="content/70-wrap.js"></script>

  <!-- engine -->
  <script src="js/visualizations.js"></script>
  <script src="js/navigation.js"></script>
  <script src="js/presentation.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
